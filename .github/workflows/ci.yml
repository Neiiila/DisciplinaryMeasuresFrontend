name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'

jobs:
  quality:
    name: ${{ matrix.task.name }}
    runs-on: ubuntu-latest
    strategy:
      # Keep going so one failing gate does not hide the others: a PR should
      # surface every problem in a single run rather than one per push.
      fail-fast: false
      matrix:
        task:
          - { name: Lint, run: npm run lint }
          - { name: Typecheck, run: npm run typecheck }
          - { name: Tests, run: npm run test:coverage }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - run: ${{ matrix.task.run }}

      - name: Upload coverage
        if: matrix.task.name == 'Tests'
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          retention-days: 7

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - run: npm run build

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7
